<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PedroOS</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="script" href="s">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="logo-header">
            <h1 class="logo-title">PedroOS</h1>
            <div class="online">
                <i class="bi bi-circle-fill text-gray" style="font-size: 7px"></i>
                <p class="text-online">Online</p>
            </div>
            
        </div>
        <div class="data-header">
            <p id="data"></p>
            <p id="hora"></p>
        </div>
        <nav>
            <ul class="nav-links">
                <i class="bi bi-wifi text-light" style="font-size: 11px"></i>
                <i class="bi bi-volume-up text-light" style="font-size: 11px"></i>
                <i class="bi bi-battery-full text-light" style="font-size: 11px"></i>

            </ul>
        </nav>
    </header>

    <div class="container">
        <div class="apps-bar">
            <button class="app-bt"><i class="bi bi-terminal text-light" style="font-size: 35px"></i></button>
            <button class="app-bt"><i class="bi bi-folder-fill text-light" style="font-size: 35px"></i></button>
            <button class="app-bt"><i class="bi bi-person-fill text-light" style="font-size: 37px"></i></button>
        </div>
    </div>

</body>
<script>
    function atualizarRelogio() {
        const agora = new Date();
        
        // Define o formato: dd/mm/aa e hh:mm:ss
        const data = agora.toLocaleString('pt-BR', {
            day: '2-digit',
            month: '2-digit',
            year: '2-digit'
        });

        const hora = agora.toLocaleString('pt-BR', {
            hour: '2-digit',
            minute: '2-digit'
        });


        // Exibe na tela
        document.getElementById('data').innerText = data;
        document.getElementById('hora').innerText = hora;
    }

    // Executa a cada 1 segundo
    setInterval(atualizarRelogio, 1000);
    
    // Executa imediatamente ao abrir a página
    atualizarRelogio();
</script>
