/* =========================================================

========================================================= */

function atualizarRelogio() {

    const agora = new Date();


    const data =
        agora.toLocaleString(
            "pt-BR",
            {
                day: "2-digit",
                month: "2-digit",
                year: "2-digit"
            }
        );


    const hora =
        agora.toLocaleString(
            "pt-BR",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );


    const dataElemento =
        document.getElementById("data");


    const horaElemento =
        document.getElementById("hora");


    if (dataElemento) {

        dataElemento.textContent = data;

    }


    if (horaElemento) {

        horaElemento.textContent = hora;

    }

}


atualizarRelogio();

setInterval(
    atualizarRelogio,
    1000
);



/* =========================================================
   CURRÍCULO
========================================================= */

function abrirArquivo(src) {

    const overlay =
        document.getElementById(
            "fileOverlay"
        );


    const frame =
        document.getElementById(
            "fileFrame"
        );


    if (!overlay || !frame) {
        return;
    }


    frame.src = src;

    overlay.classList.add(
        "active"
    );

    document.body.classList.add(
        "viewer-open"
    );

}


function fecharArquivo() {

    const overlay =
        document.getElementById(
            "fileOverlay"
        );


    const frame =
        document.getElementById(
            "fileFrame"
        );


    if (!overlay || !frame) {
        return;
    }


    overlay.classList.remove(
        "active"
    );

    document.body.classList.remove(
        "viewer-open"
    );


    frame.src = "";

}

/* =========================================================
   RENDER DA SEÇÃO DA TRAJETÓRIA
========================================================= */

function renderTrajectorySection(
    win,
    sectionName
) {

    const data =
        trajectoryData[sectionName];


    if (!data) {
        return;
    }


    const content =
        win.querySelector(
            "#trajectory-content"
        );


    const title =
        win.querySelector(
            "#trajectory-title"
        );


    const subtitle =
        win.querySelector(
            "#trajectory-subtitle"
        );


    if (!content) {
        return;
    }


    if (title) {

        title.textContent =
            data.title;

    }


    if (subtitle) {

        subtitle.textContent =
            data.subtitle;

    }


    win
        .querySelectorAll(
            ".trajectory-menu"
        )
        .forEach(menu => {

            menu.classList.toggle(
                "active",
                menu.dataset.section === sectionName
            );

        });



    if (data.custom === "skills") {

        content.innerHTML =
            renderSkills();

        return;

    }


    if (data.custom === "certificates") {

        content.innerHTML =
            renderCertificates();

        return;

    }


    content.innerHTML =
        renderTimeline(
            data.items
        );

}



/* =========================================================
   INICIALIZAR TRAJETÓRIA
========================================================= */

function initTrajectory(win) {

    const sidebar =
        win.querySelector(
            ".trajectory-sidebar"
        );


    const content =
        win.querySelector(
            "#trajectory-content"
        );


    if (!sidebar || !content) {
        return;
    }


    /*
       IMPORTANTE:

       Não adicionamos listeners diretamente
       nos elementos da timeline.

       Usamos delegação de eventos.

       Assim, quando o innerHTML muda,
       os eventos continuam funcionando.
    */


    sidebar.addEventListener(
        "click",
        event => {

            const menu =
                event.target.closest(
                    ".trajectory-menu"
                );


            if (!menu) {
                return;
            }


            const section =
                menu.dataset.section;


            renderTrajectorySection(
                win,
                section
            );

        }
    );



    content.addEventListener(
        "click",
        event => {

            const item =
                event.target.closest(
                    ".timeline-item"
                );


            if (!item) {
                return;
            }


            const section =
                win.querySelector(
                    ".trajectory-menu.active"
                );


            if (!section) {
                return;
            }


            const sectionName =
                section.dataset.section;


            const data =
                trajectoryData[sectionName];


            if (!data || !data.items) {
                return;
            }


            const index =
                Number(
                    item.dataset.index
                );


            const selected =
                data.items[index];


            if (!selected) {
                return;
            }


            win
                .querySelectorAll(
                    ".timeline-item"
                )
                .forEach(
                    element =>
                        element.classList.remove(
                            "selected"
                        )
                );


            item.classList.add(
                "selected"
            );


            const details =
                renderTrajectoryDetails(
                    selected
                );


            const oldDetails =
                win.querySelector(
                    ".trajectory-details"
                );


            if (oldDetails) {

                oldDetails.outerHTML =
                    details;

            }

        }
    );



    /*
       Primeira seção.
    */

    renderTrajectorySection(
        win,
        "linha-tempo"
    );

}

function escaparHTML(texto) {

    return texto
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        );

}

/* =========================================================
   ABRIR JANELA
========================================================= */

function openWindow(appName) {

    const app =
        apps[appName];


    if (!app) {
        return;
    }


    const existing =
        document.querySelector(
            `[data-window="${appName}"]`
        );


    if (existing) {

        existing.style.zIndex =
            ++zIndex;

        return;

    }


    const win =
        document.createElement(
            "div"
        );


    win.classList.add(
        "window"
    );


    win.dataset.window =
        appName;


    const larguraDesejada =
        parseInt(
            app.width
        ) || 700;


    const alturaDesejada =
        parseInt(
            app.height
        ) || 500;


    const mobile =
        window.innerWidth <= 600;


    const espacoLateral =
        mobile
            ? 16
            : window.innerWidth <= 850
                ? 100
                : 150;


    const espacoVertical =
        mobile
            ? 132
            : 80;


    const larguraMaxima =
        Math.max(
            280,
            window.innerWidth -
            espacoLateral
        );


    const alturaMaxima =
        Math.max(
            250,
            window.innerHeight -
            espacoVertical
        );


    const larguraFinal =
        Math.min(
            larguraDesejada,
            larguraMaxima
        );


    const alturaFinal =
        Math.min(
            alturaDesejada,
            alturaMaxima
        );


    win.style.width =
        `${larguraFinal}px`;


    win.style.height =
        `${alturaFinal}px`;


    win.style.zIndex =
        ++zIndex;


    win.innerHTML = `

        <div class="window-header">

            <p class="window-title">
                ${app.title || ""}
            </p>


            <button
                class="window-close"
                type="button"
            >

                <i
                    class="bi bi-x-lg"
                ></i>

            </button>

        </div>


        <div class="window-content">

            ${app.content || ""}

        </div>

    `;


    windowArea.appendChild(
        win
    );


    /*
       Posiciona depois de inserir
       no DOM para que offsetWidth
       e offsetHeight estejam corretos.
    */

    posicionarJanela(
        win
    );


    /*
       Inicializadores específicos.
    */

    if (appName === "terminal") {

        iniciarTerminal(
            win
        );

    }


    if (appName === "projetos") {

        win.classList.add(
            "projects-window"
        );

        iniciarProjetos(
            win
        );

    }


    if (appName === "sobre") {

        win.classList.add(
            "about-window"
        );

    }


    if (appName === "contato") {

        win.classList.add(
            "contact-window"
        );

    }


    if (appName === "trajetoria") {

        win.classList.add(
            "trajectory-window"
        );

        initTrajectory(
            win
        );

    }


    /*
       Fechar.
    */

    const close =
        win.querySelector(
            ".window-close"
        );


    if (close) {

        close.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                win.remove();

            }
        );

    }


    /*
       Trazer para frente.
    */

    win.addEventListener(
        "mousedown",
        () => {

            win.style.zIndex =
                ++zIndex;

        }
    );


    makeDraggable(
        win
    );

}



/* =========================================================
   DRAG DAS JANELAS
========================================================= */

function makeDraggable(win) {

    const header =
        win.querySelector(
            ".window-header"
        );


    if (!header) {
        return;
    }


    let dragging =
        false;


    let offsetX =
        0;


    let offsetY =
        0;


    header.addEventListener(
        "mousedown",
        event => {

            if (
                window.innerWidth <= 600
            ) {
                return;
            }


            /*
               Não inicia drag ao clicar
               no botão de fechar.
            */

            if (
                event.target.closest(
                    ".window-close"
                )
            ) {
                return;
            }


            dragging =
                true;


            offsetX =
                event.clientX -
                win.offsetLeft;


            offsetY =
                event.clientY -
                win.offsetTop;


            win.style.zIndex =
                ++zIndex;

        }
    );


    document.addEventListener(
        "mousemove",
        event => {

            if (!dragging) {
                return;
            }


            let x =
                event.clientX -
                offsetX;


            let y =
                event.clientY -
                offsetY;


            const maxX =
                windowArea.clientWidth -
                win.offsetWidth;


            const maxY =
                windowArea.clientHeight -
                win.offsetHeight;


            x =
                Math.max(
                    0,
                    Math.min(
                        x,
                        maxX
                    )
                );


            y =
                Math.max(
                    0,
                    Math.min(
                        y,
                        maxY
                    )
                );


            win.style.left =
                `${x}px`;


            win.style.top =
                `${y}px`;

        }
    );


    document.addEventListener(
        "mouseup",
        () => {

            dragging =
                false;

        }
    );

}



/* =========================================================
   POSICIONAR JANELA
========================================================= */

function posicionarJanela(win) {

    if (
        window.innerWidth <= 600
    ) {

        win.style.left =
            "8px";

        win.style.top =
            "8px";

        return;

    }


    const larguraArea =
        windowArea.clientWidth;


    const alturaArea =
        windowArea.clientHeight;


    /*
       A barra inferior é fixed,
       portanto não precisa reservar
       espaço lateral para ela.
    */

    const left =
        Math.max(
            15,
            (
                larguraArea -
                win.offsetWidth
            ) / 2
        );


    const top =
        Math.max(
            20,
            (
                alturaArea -
                win.offsetHeight
            ) / 2
        );


    win.style.left =
        `${left}px`;


    win.style.top =
        `${top}px`;

}



/* =========================================================
   BOTÕES DOS APPS
========================================================= */

document
    .querySelectorAll(
        ".app-bt"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    const appName =
                        button.dataset.app;


                    const app =
                        apps[appName];


                    if (!app) {
                        return;
                    }


                    if (app.action) {

                        app.action();

                    }
                    else {

                        openWindow(
                            appName
                        );

                    }

                }
            );

        }
    );



/* =========================================================
   RESPONSIVIDADE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        const janelas =
            document.querySelectorAll(
                ".window"
            );


        janelas.forEach(
            win => {

                const mobile =
                    window.innerWidth <= 600;


                const larguraMaxima =
                    mobile
                        ? window.innerWidth - 16
                        : window.innerWidth - 30;


                const alturaMaxima =
                    mobile
                        ? window.innerHeight - 132
                        : window.innerHeight - 80;


                if (
                    win.offsetWidth >
                    larguraMaxima
                ) {

                    win.style.width =
                        `${larguraMaxima}px`;

                }


                if (
                    win.offsetHeight >
                    alturaMaxima
                ) {

                    win.style.height =
                        `${alturaMaxima}px`;

                }


                posicionarJanela(
                    win
                );

            }
        );

    }
);



/* =========================================================
   TECLADO MOBILE / TERMINAL
========================================================= */

if (
    window.visualViewport
) {

    window.visualViewport.addEventListener(
        "resize",
        () => {

            const terminal =
                document.querySelector(
                    '[data-window="terminal"]'
                );


            if (!terminal) {
                return;
            }


            const output =
                terminal.querySelector(
                    "#terminal-output"
                );


            if (output) {

                output.scrollTop =
                    output.scrollHeight;

            }

        }
    );

}



/* =========================================================
   ESC FECHA CURRÍCULO
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key !== "Escape"
        ) {
            return;
        }


        const overlay =
            document.getElementById(
                "fileOverlay"
            );


        if (
            overlay &&
            overlay.classList.contains(
                "active"
            )
        ) {

            fecharArquivo();

        }

    }
);


</script>
