<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PedroOS</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="script" href="s">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="logo-header">
            <h1 class="logo-title">PedroOS</h1>
            <div class="online">
                <i class="bi bi-circle-fill text-gray" style="font-size: 7px"></i>
                <p class="text-online">Online</p>
            </div>
            
        </div>
        <div class="data-header">
            <p id="data"></p>
            <p id="hora"></p>
        </div>
        <nav>
            <ul class="nav-links">
                <i class="bi bi-wifi text-light" style="font-size: 13px"></i>
                <i class="bi bi-volume-up text-light" style="font-size: 13px"></i>
                <i class="bi bi-battery-full text-light" style="font-size: 13px"></i>

            </ul>
        </nav>
    </header>

    <div id="window-area" class="desktop">
        <div class="apps-bar">
            <div class="app">
                <button class="app-bt" data-app="terminal">
                    <i class="bi bi-terminal text-light" style="font-size: 35px"></i> 
                    <p class="app-name">Terminal</p>
                </button>
            </div>
            <div class="app">
                <button class="app-bt" data-app="projetos">
                    <i class="bi bi-folder-fill text-light" style="font-size: 35px"></i>
                    <p class="app-name">Projetos</p>
                </button>
            </div>
            <div class="app">
                <button class="app-bt" data-app="sobre">
                    <i class="bi bi-person-fill text-light" style="font-size: 37px"></i>
                    <p class="app-name">Sobre mim</p>
                </button>
            </div>
            <div class="app">
                <button class="app-bt" data-app="curriculo">
                    <i class="bi bi-file-earmark-text-fill text-light" style="font-size: 37px"></i>
                    <p class="app-name">Currículo</p>
                </button>
            </div>
            <div class="app">
                <button class="app-bt" data-app="contato">
                    <i class="bi bi-envelope-fill text-light" style="font-size: 37px"></i>
                    <p class="app-name">Contato</p>
                </button>
            </div>
        </div>
    </div>
    <div id="fileOverlay" class="file-overlay">
        <button class="close-viewer" onclick="fecharArquivo()">
            <i class="bi bi-x-lg"></i>
        </button>

        <div class="file-viewer">
            <iframe id="fileFrame"></iframe>
        </div>
    </div>
</body>
<script>
    function atualizarRelogio() {
        const agora = new Date();
        
        // Define o formato: dd/mm/aa e hh:mm:ss
        const data = agora.toLocaleString('pt-BR', {
            day: '2-digit',
            month: '2-digit',
            year: '2-digit'
        });

        const hora = agora.toLocaleString('pt-BR', {
            hour: '2-digit',
            minute: '2-digit'
        });


        // Exibe na tela
        document.getElementById('data').innerText = data;
        document.getElementById('hora').innerText = hora;
    }

    function abrirArquivo(src) {
    const overlay = document.getElementById("fileOverlay");
    const frame = document.getElementById("fileFrame");

    frame.src = src;
    overlay.classList.add("active");
    document.body.classList.add("viewer-open");
    }

    function fecharArquivo() {
        const overlay = document.getElementById("fileOverlay");
        const frame = document.getElementById("fileFrame");

        overlay.classList.remove("active");
        document.body.classList.remove("viewer-open");

        frame.src = "";
    }

    // Executa a cada 1 segundo
    setInterval(atualizarRelogio, 1000);
    
    // Executa imediatamente ao abrir a página
    atualizarRelogio();

    const windowArea = document.getElementById("window-area");
    const appButtons = document.querySelectorAll(".app-bt");

    let zIndex = 20;

    const apps = {
        terminal: {
            title: "Terminal",
            width: "900px",
            height: "500px",
            content: `
                <div id="terminal-output" class="terminal-output">
                    <p>PedroOS Terminal v1.0</p>
                    <p>Digite <span style="color:#5BFF86">help</span> para listar os comandos.</p>
                </div>
                <div class="terminal-input-line">
                    <span>pedro@pedroos:~$</span>
                    <input id="terminal-input" type="text" autocomplete="off">
                </div>
            `
        },
        projetos: {
            title: "Projetos",
            width: "800px",
            height: "500px",
            content: `
                <h3>Projetos</h3>
                <p>Api Academia</p>
                <p>Portfólio PedroOS</p>
                <p>Sistema com .NET, SQL Server e JWT</p>
                <a class="link-btn" href="https://github.com/duffy730" target="_blank">Meu GitHub</a>
            `
        },
        sobre: {
            title: "Sobre Mim",
            width: "900px",
            height: "500px",
            content: `
                <h3>Pedro Chair</h3>
                <p style="color: var(--accent-purple);">Sou estudante de Ciências e Tecnologia na UFBA e desenvolvedor em formação, com foco em desenvolvimento backend utilizando C#, ASP.NET Core, SQL Server e JavaScript. Atualmente atuo como Trainee no DETRAN, onde participo de projetos reais de desenvolvimento de software, aplicando conhecimentos em APIs REST, banco de dados e boas práticas de programação.
                <p style="color: var(--accent-purple);">Tenho interesse em tecnologia, desenvolvimento de sistemas e resolução de problemas, buscando constantemente aprimorar minhas habilidades técnicas e aprender novas ferramentas e metodologias. Valorizo o trabalho em equipe, a troca de conhecimento e os desafios que contribuem para meu crescimento profissional.
                <p style="color: var(--success);">Meu objetivo é evoluir como desenvolvedor, adquirindo experiência prática e contribuindo para a criação de soluções eficientes, escaláveis e que gerem impacto positivo para os usuários..
            `
        },
        curriculo: {
            action: () => {
                window.open("assets/img/Curriculo.pdf", "_blank");
            }
        },
        contato: {
            title: "Contato",
            width: "330px",
            height: "290px",
            content: `
                <h3>Contato</h3>
                <a class="link-btn" href="https://github.com/duffy730" target="_blank">GitHub</a>
                <a class="link-btn" href="https://www.linkedin.com/in/pedro-chair-30690a29a/" target="_blank">LinkedIn</a>
                <a class="link-btn" href="mailto:pedrochair730@gmail.com" target="_blank">Enviar Email</a>
            `
        }
    };

    appButtons.forEach(button => {
        button.addEventListener("click", () => {
            const appName = button.dataset.app;
            const app = apps[appName];

            if (!app) return;

            if (app.action) {
                app.action();
            } else {
                openWindow(appName);
            }
        });
    });

    function openWindow(appName) {
        const app = apps[appName];

        if (!app) return;

        const existingWindow = document.querySelector(`[data-window="${appName}"]`);

        if (existingWindow) {
            existingWindow.style.zIndex = ++zIndex;
            return;
        }

        const win = document.createElement("div");
        win.classList.add("window");

        win.style.width = app.width || "700px";
        win.style.height = app.height || "500px";

        win.dataset.window = appName;
        win.style.zIndex = ++zIndex;

        win.innerHTML = `
            <div class="window-header">
                <p class="window-title">${app.title}</p>
                <button class="window-close">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>

            <div class="window-content">
                ${app.content}
            </div>
        `;

        windowArea.appendChild(win);

        if(appName === "terminal"){
            iniciarTerminal();
        }

        win.querySelector(".window-close").addEventListener("click", () => {
            win.remove();
        });

        win.addEventListener("mousedown", () => {
            win.style.zIndex = ++zIndex;
        });

        makeDraggable(win);

        
    }

    function makeDraggable(win) {
        const header = win.querySelector(".window-header");

        let isDragging = false;
        let offsetX = 0;
        let offsetY = 0;

        header.addEventListener("mousedown", (e) => {
            isDragging = true;

            offsetX = e.clientX - win.offsetLeft;
            offsetY = e.clientY - win.offsetTop;
        });

        document.addEventListener("mousemove", (e) => {
            if (!isDragging) return;

            let x = e.clientX - offsetX;
            let y = e.clientY - offsetY;

            const maxX = windowArea.clientWidth - win.offsetWidth;
            const maxY = windowArea.clientHeight - win.offsetHeight;

            x = Math.max(0, Math.min(x, maxX));
            y = Math.max(0, Math.min(y, maxY));

            win.style.left = `${x}px`;
            win.style.top = `${y}px`;
        });

        document.addEventListener("mouseup", () => {
            isDragging = false;
        });
    }

    function iniciarTerminal(){

        const input = document.getElementById("terminal-input");
        const output = document.getElementById("terminal-output");

        if(!input) return;

        input.focus();

        input.addEventListener("keydown",function(e){

            if(e.key !== "Enter") return;

            const comando = input.value.trim().toLowerCase();

            output.innerHTML += `<p style="color:#29E6FF;">pedro@pedroos:~$ ${comando}</p>`;

            switch(comando){

                case "help":

                    output.innerHTML += `
                    <p>
                    help<br>
                    about<br>
                    skills<br>
                    projects<br>
                    github<br>
                    linkedin<br>
                    contact<br>
                    profile<br>
                    curriculo<br>
                    date<br>
                    clear
                    </p>`;
                    break;

                case "about":

                    output.innerHTML += `<p>Desenvolvedor Backend .NET apaixonado por tecnologia.</p>`;
                    break;

                case "skills":

                    output.innerHTML += `<p>C#, ASP.NET Core, SQL Server, JavaScript, React, Entity Framework, JWT</p>`;
                    break;

                case "projects":

                    output.innerHTML += `<p>• API Academia<br>• PedroOS<br>• Sistema DETRAN</p>`;
                    break;

                case "github":

                    window.open("https://github.com/duffy730");
                    break;

                case "linkedin":

                    window.open("https://www.linkedin.com/in/pedro-chair-30690a29a/");
                    break;

                case "contact":

                    output.innerHTML += `<p>Email: pedrochair730@gmail.com</p>`;
                    break;

                case "curriculo":

                    abrirArquivo("assets/img/Curriculo.pdf");
                    break;

                case "date":

                    output.innerHTML += `<p>${new Date().toLocaleString()}</p>`;
                    break;

                case "profile":

                    output.innerHTML += `
                    <pre>
PedroOS
--------
Nome: Pedro Chair
Curso: Ciência e Tecnologia - UFBA
Stack: .NET | C# | SQL Server
Cargo: Trainee DETRAN
                    </pre>`;
                    break;

                case "clear":

                    output.innerHTML = "";
                    break;

                default:

                    output.innerHTML += `<p>Comando não encontrado: ${comando}</p>`;
            }

            output.scrollTop = output.scrollHeight;

            input.value="";
        });
    }
</script>
