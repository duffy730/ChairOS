<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PedroOS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="logo-header">
            <h1 class="logo-title">PedroOS</h1>
            <p class="logo-online">Online</p>
        </div>
        <div class="data-header">
            <p id="relogio"></p>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
</body>
<script>
    function atualizarRelogio() {
        const agora = new Date();
        
        // Define o formato: dd/mm/aa e hh:mm:ss
        const data = agora.toLocaleString('pt-BR', {
            day: '2-digit',
            month: '2-digit',
            year: '2-digit'
        });

        const hora = agora.toLocaleString('pt-BR', {
            hour: '2-digit',
            minute: '2-digit'
        });

        const resultado = data + ' ' + hora;

        // Exibe na tela
        document.getElementById('relogio').innerText = resultado;
    }

    // Executa a cada 1 segundo
    setInterval(atualizarRelogio, 1000);
    
    // Executa imediatamente ao abrir a página
    atualizarRelogio();
</script>
