<script>
    function atualizarRelogio() {
        const agora = new Date();
        
        // Define o formato: dd/mm/aa e hh:mm:ss
        const data = agora.toLocaleString('pt-BR', {
            day: '2-digit',
            month: '2-digit',
            year: '2-digit'
        });

        const hora = agora.toLocaleString('pt-BR', {
            hour: '2-digit',
            minute: '2-digit'
        });


        // Exibe na tela
        document.getElementById('data').innerText = data;
        document.getElementById('hora').innerText = hora;
    }

    function abrirArquivo(src) {
    const overlay = document.getElementById("fileOverlay");
    const frame = document.getElementById("fileFrame");

    frame.src = src;
    overlay.classList.add("active");
    document.body.classList.add("viewer-open");
    }

    function fecharArquivo() {
        const overlay = document.getElementById("fileOverlay");
        const frame = document.getElementById("fileFrame");

        overlay.classList.remove("active");
        document.body.classList.remove("viewer-open");

        frame.src = "";
    }

    // Executa a cada 1 segundo
    setInterval(atualizarRelogio, 1000);
    
    // Executa imediatamente ao abrir a página

    function iniciarProjetos(win) {
        const botoes = win.querySelectorAll(".project-item");
        const container = win.querySelector(".project-content");

                    botao.dataset.project === id
                );
            });

                .map(tecnologia => {
                    return `

                            ${tecnologia}
                        </span>
                    `;
                })
                .join("");

                        </span>

                        <span>${projeto.arquivo}</span>

                        <div class="code-dots">
                            <span></span>

                            <span></span>
                        </div>
                    </div>

                    <pre><code>${escaparHTML(projeto.codigo)}</code></pre>
                </div>

                    class="project-github"
                    href="${projeto.github}"
                    target="_blank"
                    rel="noopener noreferrer"
                >

                    Ver no GitHub
                </a>
            `;

            botao.addEventListener("click", () => {
                selecionarProjeto(botao.dataset.project);
            });
        });

        selecionarProjeto("pedroos");
    }

    function escaparHTML(texto) {
        return texto
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;");
    }

    appButtons.forEach(button => {
        button.addEventListener("click", () => {
            const appName = button.dataset.app;
            const app = apps[appName];

            if (!app) return;

            if (app.action) {
                app.action();
            } else {
                openWindow(appName);
            }
        });
    });

    function openWindow(appName) {
        const app = apps[appName];

        if (!app) return;

        const existingWindow = document.querySelector(`[data-window="${appName}"]`);

        if (existingWindow) {
            existingWindow.style.zIndex = ++zIndex;
            return;
        }

        const win = document.createElement("div");
        win.classList.add("window");

        const larguraDesejada = parseInt(app.width) || 700;
        const alturaDesejada = parseInt(app.height) || 500;

        const espacoLateral = window.innerWidth <= 600
            ? 16
            : window.innerWidth <= 850
                ? 100
                : 150;

        const espacoVertical = window.innerWidth <= 600
            ? 132
            : 80;

        const larguraMaxima = window.innerWidth - espacoLateral;
        const alturaMaxima = window.innerHeight - espacoVertical;

        const larguraFinal = Math.min(larguraDesejada, larguraMaxima);
        const alturaFinal = Math.min(alturaDesejada, alturaMaxima);

        win.style.width = `${larguraFinal}px`;
        win.style.height = `${alturaFinal}px`;

        win.dataset.window = appName;
        win.style.zIndex = ++zIndex;

        win.innerHTML = `
            <div class="window-header">
                <p class="window-title">${app.title}</p>
                <button class="window-close">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>

            <div class="window-content">
                ${app.content}
            </div>
        `;

        windowArea.appendChild(win);

        posicionarJanela(win);

        if(appName === "terminal"){
            iniciarTerminal();
        }

        if (appName === "projetos") {
            win.classList.add("projects-window");
            iniciarProjetos(win);
        }

        if (appName === "sobre") {
            win.classList.add("about-window");
        }

        if (appName === "contato") {
            win.classList.add("contact-window");
        }

        win.querySelector(".window-close").addEventListener("click", () => {
            win.remove();
        });

        win.addEventListener("mousedown", () => {
            win.style.zIndex = ++zIndex;
        });

        makeDraggable(win);

        
    }

    function makeDraggable(win) {
        const header = win.querySelector(".window-header");

        let isDragging = false;
        let offsetX = 0;
        let offsetY = 0;

        header.addEventListener("mousedown", (e) => {
            if (window.innerWidth <= 600) return;
            
            isDragging = true;

            offsetX = e.clientX - win.offsetLeft;
            offsetY = e.clientY - win.offsetTop;
        });

        document.addEventListener("mousemove", (e) => {
            if (!isDragging) return;

            let x = e.clientX - offsetX;
            let y = e.clientY - offsetY;

            const maxX = windowArea.clientWidth - win.offsetWidth;
            const maxY = windowArea.clientHeight - win.offsetHeight;

            x = Math.max(0, Math.min(x, maxX));
            y = Math.max(0, Math.min(y, maxY));

            win.style.left = `${x}px`;
            win.style.top = `${y}px`;
        });

        document.addEventListener("mouseup", () => {
            isDragging = false;
        });
    }

PedroOS
--------

    function posicionarJanela(win) {
        if (window.innerWidth <= 600) {
            win.style.left = "8px";
            win.style.top = "8px";
            return;
        }

        const larguraArea = windowArea.clientWidth;
        const alturaArea = windowArea.clientHeight;

        const larguraSidebar = window.innerWidth <= 1200 ? 90 : 110;

        const espacoDisponivel =
            larguraArea - larguraSidebar;

        const left =
            larguraSidebar +
            Math.max(
                15,
                (espacoDisponivel - win.offsetWidth) / 2
            );

        const top = Math.max(
            20,
            (alturaArea - win.offsetHeight) / 2
        );

        win.style.left = `${left}px`;
        win.style.top = `${top}px`;
    }

    window.addEventListener("resize", () => {
        const janelas = document.querySelectorAll(".window");

        janelas.forEach(win => {
            const larguraMaxima =
                window.innerWidth <= 600
                    ? window.innerWidth - 16
                    : window.innerWidth - 150;

            const alturaMaxima =
                window.innerWidth <= 600
                    ? window.innerHeight - 132
                    : window.innerHeight - 80;

            if (win.offsetWidth > larguraMaxima) {
                win.style.width = `${larguraMaxima}px`;
            }

            if (win.offsetHeight > alturaMaxima) {
                win.style.height = `${alturaMaxima}px`;
            }

            posicionarJanela(win);
        });
    });

    if (window.visualViewport) {

        window.visualViewport.addEventListener("resize", () => {

            const output = document.getElementById("terminal-output");

            if (output) {
                output.scrollTop = output.scrollHeight;
            }

        });

    }
